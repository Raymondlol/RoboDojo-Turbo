<svg xmlns="http://www.w3.org/2000/svg" width="900" height="358" viewBox="0 0 900 358" role="img" aria-label="RoboDojo-Turbo vs official RoboDojo evaluation wall-clock"><title>RoboDojo-Turbo vs official RoboDojo evaluation wall-clock</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}.m{fill:#9198a1}.b{font-weight:600}.t{fill:#4493f8}</style><text x="24.0" y="34.0" font-size="19" class="b" text-anchor="start">Same tasks and scoring, about half the wall-clock time</text><text x="24.0" y="56.0" font-size="12" class="m" text-anchor="start">stack_blocks · 25 official layouts · Pi_05 · 1 × 10 envs · RTX 5090 + Ryzen 9 9950X3D · mean of 2 alternating runs per arm</text><text x="24.0" y="88.0" font-size="13" class="b" text-anchor="start">Wall-clock for all 25 layouts</text><text x="24.0" y="108.0" font-size="13" text-anchor="start">Official RoboDojo</text><rect x="24" y="116" width="300.0" height="26" rx="4" fill="#6e7681"/><text x="332.0" y="134.0" font-size="13" text-anchor="start">10.6 min</text><text x="24.0" y="178.0" font-size="13" class="t b" text-anchor="start">RoboDojo-Turbo</text><rect x="24" y="186" width="140.8" height="26" rx="4" fill="#4493f8"/><text x="172.8" y="204.0" font-size="13" class="t b" text-anchor="start">5.0 min</text><text x="24.0" y="266.0" font-size="30" class="t b" text-anchor="start">2.13× faster</text><text x="24.0" y="288.0" font-size="11" class="m" text-anchor="start">636 s → 299 s (policy server start to last client exit)</text><text x="470.0" y="88.0" font-size="13" class="b" text-anchor="start">Layouts finished over time</text><line x1="470" y1="274.0" x2="860" y2="274.0" stroke="#3d444d" stroke-width="1"/><text x="464.0" y="278.0" font-size="11" class="m" text-anchor="end">0</text><line x1="470" y1="206.0" x2="860" y2="206.0" stroke="#3d444d" stroke-width="1"/><text x="464.0" y="210.0" font-size="11" class="m" text-anchor="end">10</text><line x1="470" y1="138.0" x2="860" y2="138.0" stroke="#3d444d" stroke-width="1"/><text x="464.0" y="142.0" font-size="11" class="m" text-anchor="end">20</text><line x1="470" y1="104.0" x2="860" y2="104.0" stroke="#3d444d" stroke-width="1"/><text x="464.0" y="108.0" font-size="11" class="m" text-anchor="end">25</text><text x="470.0" y="290.0" font-size="11" class="m" text-anchor="middle">0</text><text x="540.9" y="290.0" font-size="11" class="m" text-anchor="middle">2</text><text x="611.8" y="290.0" font-size="11" class="m" text-anchor="middle">4</text><text x="682.7" y="290.0" font-size="11" class="m" text-anchor="middle">6</text><text x="753.6" y="290.0" font-size="11" class="m" text-anchor="middle">8</text><text x="824.5" y="290.0" font-size="11" class="m" text-anchor="middle">10</text><text x="860.0" y="306.0" font-size="11" class="m" text-anchor="end">minutes since launch (points: batches finishing, measured; lines join them)</text><polyline points="470.0,274.0 620.7,206.0 744.2,138.0 843.3,104.0" fill="none" stroke="#6e7681" stroke-width="3" stroke-linejoin="round"/><circle cx="620.7" cy="206.0" r="4.5" fill="#6e7681"/><circle cx="744.2" cy="138.0" r="4.5" fill="#6e7681"/><circle cx="843.3" cy="104.0" r="4.5" fill="#6e7681"/><text x="754.2" y="156.0" font-size="12" text-anchor="start">Official RoboDojo</text><polyline points="470.0,274.0 534.1,206.0 591.1,138.0 644.8,104.0" fill="none" stroke="#4493f8" stroke-width="3" stroke-linejoin="round"/><circle cx="534.1" cy="206.0" r="4.5" fill="#4493f8"/><circle cx="591.1" cy="138.0" r="4.5" fill="#4493f8"/><circle cx="644.8" cy="104.0" r="4.5" fill="#4493f8"/><text x="581.1" y="130.0" font-size="12" class="t b" text-anchor="end">RoboDojo-Turbo</text><text x="24.0" y="332.0" font-size="11" class="m" text-anchor="start">Same physics settings, dt and render cadence; PhysX state bit-identical under open-loop replay (layouts 0-9). Turbo records one camera</text><text x="24.0" y="346.0" font-size="11" class="m" text-anchor="start">video instead of three and keeps a JAX compile cache (about 6 s of its time). Conditions and raw data: docs/benchmark.md, docs/data/benchmark.json.</text></svg>
